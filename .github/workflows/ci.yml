name: Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked --offline
      - run: cargo test --workspace --locked --offline
      - run: cargo test --workspace --release --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo run -p hesper
      - run: cargo run -p hesper -- --trace
      - run: cargo run -p hesper -- --bus-trace --trace-limit 4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p hesper-cpu6502 --target wasm32-unknown-unknown --locked
