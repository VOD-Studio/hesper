name: Full CPU conformance

# Explicit opt-in: ordinary PRs use the small fixtures already in the repository.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  full-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: rustup toolchain install stable --profile minimal
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          bun --version
      - run: cargo fetch --locked
      - name: Prepare pinned external data and assembler
        run: |
          bun tools/prepare_singlestep.ts --full
          bun tools/prepare_klaus.ts
          bun tools/prepare_visual6502.ts
      - name: All official single-step cases (state, counts, bus sequences)
        run: cargo run -p hesper-cpu6502 --example singlestep --release --locked --offline -- --full
      - name: Klaus official functional program
        run: cargo run -p hesper-cpu6502 --example functional --release --locked --offline
      - name: Exhaustive NMOS decimal including all flags and invalid BCD
        run: cargo run -p hesper-cpu6502 --example functional --release --locked --offline -- --decimal
      - name: Klaus interrupt program (explicit four-cycle feedback delay)
        # Zero delay hits the upstream-documented NMOS BRK/NMI B-bit trap.
        # See tests/data/README.md; this job does not claim that configuration passes.
        run: cargo run -p hesper-cpu6502 --example interrupt --release --locked --offline -- --feedback-delay 4
      - name: Reproduce revD pin and independent RESET reference observations
        run: bun tools/verify_visual6502.ts
      - name: Compare CPU pins and check RESET reference integrity (no CPU RESET comparison)
        run: cargo test -p hesper-cpu6502 --test pins --release --locked --offline
