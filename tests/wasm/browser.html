<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hesper WASM 验证</title>
<style>
  body { max-width: 900px; margin: 3rem auto; padding: 0 1rem; font: 16px/1.6 system-ui; }
  pre { white-space: pre-wrap; background: #f3f4f6; padding: 1rem; }
</style>
<h1>Hesper WASM 验证</h1>
<p>浏览器直接加载三种实际 Wasm ES Module，对照同版本原生 Rust 的执行结果。</p>
<pre id="result" role="status">正在加载…</pre>
<script type="module">
  import initCpu, { Cpu6502Ram } from "../../target/wasm-packages/cpu6502/web/hesper_cpu6502.js";
  import initApple, { Apple1 } from "../../target/wasm-packages/apple1/web/hesper_apple1.js";
  import initRiscv, { RiscvLinux } from "../../target/wasm-packages/riscv-linux/web/hesper_riscv_linux.js";
  import { cases } from "./checks.mjs";
  import { riscvCases } from "./riscv-checks.mjs";
  const result = document.querySelector("#result");
  try {
    await Promise.all([initCpu(), initApple(), initRiscv()]);
    async function reference(file) {
      const response = await fetch(`../../target/wasm-packages/${file}.json`);
      if (!response.ok) throw new Error(`${file}.json: HTTP ${response.status}`);
      return response.json();
    }
    const [base, riscv] = await Promise.all([reference("reference"), reference("riscv-reference")]);
    const probes = [...cases(Cpu6502Ram, Apple1, base), ...riscvCases(RiscvLinux, riscv)];
    const passed = [];
    for (const [name, run] of probes) {
      run();
      passed.push(`✓ ${name}`);
      result.textContent = passed.join("\n");
    }
    result.textContent += `\n\n全部 ${passed.length} 项通过`;
    document.documentElement.dataset.result = "pass";
  } catch (error) {
    result.textContent += `\n失败：${error.stack ?? error}`;
    document.documentElement.dataset.result = "fail";
  }
</script>
</html>
