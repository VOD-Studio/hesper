[workspace]
members = [
    "crates/cpu6502", "crates/cli", "crates/apple1",
    "crates/cpu6502-wasm", "crates/apple1-wasm", "crates/wasm-support",
]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[workspace.lints.rust]
unsafe_code = "forbid"
